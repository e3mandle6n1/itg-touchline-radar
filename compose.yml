name: touchline-radar

x-hub-env: &hub-env
  EVENT_HUB_CONNECTION: Endpoint=sb://emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
  EVENT_HUB_NAME: matches
  EVENT_HUB_CONSUMER_GROUP: bridge

services:
  emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    pull_policy: always
    volumes:
      - ./infra/eventhubs/config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"
    depends_on:
      - azurite

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    pull_policy: always
    # Azure.Storage.Blobs often ships a newer x-ms-version than Azurite supports yet.
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    environment:
      <<: *hub-env
      AZURE_STORAGE_CONNECTION: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      PUBLISH_INTERVAL_MS: "240"
      BLOB_CONTAINER: matches
      MATCH_SEED_PATH: /seed
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    volumes:
      - ${MATCH_SEED_DIR}:/seed:ro
    depends_on:
      - azurite
      - emulator
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    environment:
      HOST: 0.0.0.0
      API_URL: http://api:8080
    ports:
      - "4173:4173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  azurite_data:
